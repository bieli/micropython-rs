[build]
# Cortex-M33 with its single-precision FPU
target = "thumbv8m.main-none-eabihf"
# Our linker script (memory/mg24.x: mg24-hal's, with the flash split into the
# firmware and the file system); build.rs puts it on the search path
rustflags = ["-C", "link-arg=-Tmg24.x"]

[target."thumbv8m.main-none-eabihf"]
runner = "probe-rs run --chip EFR32MG24B220F1536IM48"
