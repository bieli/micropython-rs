[package]
name = "micropython-rs"
version = "0.3.0"
edition = "2021"
authors = ["Marcin Bielak <marcin.bieli+github+micropython-rs@gmail.com>"]
license = "Apache-2.0"
description = "A minimal, no_std Python interpreter written in Rust"

[lib]
name = "micropython_rs"
path = "src/lib.rs"

[[bin]]
name = "mpy-cli"
path = "src/main.rs"

