[package]
name = "micropython-rs"
version = "0.3.0"
edition = "2021"
authors = ["Marcin Bielak <marcin.bieli+github+micropython-rs@gmail.com>"]
license = "Apache-2.0"
description = "A minimal, no_std Python interpreter written in Rust"

[lib]
name = "micropython_rs"
path = "src/lib.rs"

[[bin]]
name = "mpy-cli"
path = "src/main.rs"

[dependencies]
# Math functions for floats without `std` (sqrt, sin, pow, ...): a Rust port of
# musl's libm. Only with the `float` feature.
libm = { version = "0.2", optional = true }

[features]
default = ["full"]

# Feature levels: each includes the one before (see README, "Feature levels").
# minimal: ints, strings, bytes, lists/tuples/dicts, exceptions, `def`,
#   lambdas, closures, native and hardware modules. Smallest tables.
minimal = []
# medium: + floats and the `math` module, classes, string formatting (`%`,
#   `str.format`, f-strings, `hex()`)
medium = ["minimal", "float", "classes", "format"]
# full: + files (`open`, `os`), importing `.py` and frozen modules, `sys` and
#   `binascii`: everything Thonny and mpremote need. Largest tables.
full = ["medium", "files", "modules", "stdlib"]

# The parts the levels are made of (can also be chosen one by one)
float = ["dep:libm"]
# Single precision floats (f32) instead of double (f64), like MicroPython's
# ESP32 port: on chips with a single precision FPU (ESP32, Cortex-M4F) float
# maths runs in hardware instead of software routines
float32 = ["float"]
classes = []
format = []
files = []
modules = ["classes"]
stdlib = []

# Put the interpreter's hot loop (lexer, parser, evaluator) into the
# `.rwtext` section: on the ESP32 that's internal RAM (IRAM), which runs it
# without flash cache misses. Only for targets whose linker script has it.
iram = []
