name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Test, Coverage & Verify no_std ARM Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain, LLVM tools, and embedded targets (ARM + RISC-V)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, riscv32imc-unknown-none-elf
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Makefile (Tests, Coverage >= 30%, and Embedded Build)
        run: make all

      # Real tools against `mpy-cli --repl` on a pseudo-terminal (same REPL
      # protocol as the ESP32 firmware)
      - name: End-to-end tests with Thonny 3.2.7 and 5.0's backends and mpremote
        run: |
          # Thonny's plugin package imports tkinter (no window is opened)
          sudo apt-get install -y --no-install-recommends python3-tk > /dev/null
          cargo build
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyserial jedi asttokens mpremote
          /tmp/venv/bin/pip download --quiet --no-deps thonny==3.2.7 -d /tmp/thonny
          python3 -m zipfile -e /tmp/thonny/thonny-3.2.7-py3-none-any.whl /tmp/thonny/src
          /tmp/venv/bin/python tools/thonny_e2e.py /tmp/thonny/src
          /tmp/venv/bin/pip download --quiet --no-deps thonny==5.0.0 -d /tmp/thonny5
          python3 -m zipfile -e /tmp/thonny5/thonny-5.0.0-py3-none-any.whl /tmp/thonny5/src
          /tmp/venv/bin/python tools/thonny5_e2e.py /tmp/thonny5/src
          /tmp/venv/bin/python tools/mpremote_e2e.py
