name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Test, Coverage & Verify no_std ARM Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain, LLVM tools, and embedded targets (ARM + RISC-V)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, riscv32imc-unknown-none-elf
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Makefile (Tests, Coverage >= 30%, and Embedded Build)
        run: make all

      - name: Feature levels minimal and medium (lints, tests, no_std build)
        run: make levels

      # Real tools against `mpy-cli --repl` on a pseudo-terminal (same REPL
      # protocol as the ESP32 firmware)
      - name: End-to-end tests with Thonny 3.2.7 and 5.0's backends and mpremote
        run: |
          # Thonny's plugin package imports tkinter (no window is opened)
          sudo apt-get install -y --no-install-recommends python3-tk > /dev/null
          cargo build
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyserial jedi asttokens mpremote
          /tmp/venv/bin/pip download --quiet --no-deps thonny==3.2.7 -d /tmp/thonny
          python3 -m zipfile -e /tmp/thonny/thonny-3.2.7-py3-none-any.whl /tmp/thonny/src
          /tmp/venv/bin/python tools/thonny_e2e.py /tmp/thonny/src
          /tmp/venv/bin/pip download --quiet --no-deps thonny==5.0.0 -d /tmp/thonny5
          python3 -m zipfile -e /tmp/thonny5/thonny-5.0.0-py3-none-any.whl /tmp/thonny5/src
          /tmp/venv/bin/python tools/thonny5_e2e.py /tmp/thonny5/src
          /tmp/venv/bin/python tools/mpremote_e2e.py

  # Both ESP32 builds, in the same container as `make build`. The report lists
  # the memory regions and the biggest stack frames, and fails when the main
  # stack shrinks below 128 KB or one function takes over 32 KB of it (the
  # board-only problems of Phase 5 would have failed both)
  firmware:
    name: Firmware (${{ matrix.board }}, ${{ matrix.level }}), size and stack report
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `id` names the build's cache (cache keys can't contain commas)
          - board: generic
            id: generic-full
            features: ""
            level: full
          - board: TTGO T-Display
            id: ttgo-full
            features: tft
            level: full
          - board: generic
            id: generic-minimal
            features: ""
            level: minimal
          # Wi-Fi: its heap and driver take 70 KB of the stack's RAM (the
          # function table and statement cache are statics: 22 KB more)
          - board: TTGO T-Display + Wi-Fi
            id: ttgo-wifi
            features: tft,wifi
            level: full
            min_stack: 80
          # ESP32-S3 (Seeed XIAO ESP32-S3): console on the chip's USB port
          - board: XIAO ESP32-S3
            id: s3-full
            chip: esp32s3
            features: ""
            level: full
          - board: XIAO ESP32-S3 + Wi-Fi
            id: s3-wifi
            chip: esp32s3
            features: wifi
            level: full
            min_stack: 100
          # The heap in PSRAM (the XIAO's 8 MB octal PSRAM)
          - board: XIAO ESP32-S3 + Wi-Fi + PSRAM
            id: s3-wifi-psram
            chip: esp32s3
            features: wifi,psram
            level: full
            min_stack: 100
          # ESP32-C3 (RISC-V; ESP32-C3 Super Mini): console on the chip's USB port
          - board: ESP32-C3 Super Mini
            id: c3-full
            chip: esp32c3
            target: riscv32imc-unknown-none-elf
            features: ""
            level: full
          - board: ESP32-C3 Super Mini + Wi-Fi
            id: c3-wifi
            chip: esp32c3
            target: riscv32imc-unknown-none-elf
            features: wifi
            level: full
            min_stack: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache crates and build artifacts
        uses: actions/cache@v4
        with:
          path: micropython-esp32/target
          key: firmware-${{ matrix.id }}-${{ hashFiles('micropython-esp32/Cargo.lock', 'micropython-esp32/rust-toolchain.toml') }}
          restore-keys: firmware-${{ matrix.id }}-

      - name: Build the firmware
        working-directory: micropython-esp32
        run: >
          make build CHIP=${{ matrix.chip || 'esp32' }} FEATURES=${{ matrix.features }} LEVEL=${{ matrix.level }}
          DOCKER_FLAGS="--user root -e RUSTUP_HOME=/home/esp/.rustup -e CARGO_HOME=/home/esp/.cargo"

      - name: Memory report
        working-directory: micropython-esp32
        shell: bash
        run: |
          python3 tools/fw_report.py target/${{ matrix.target || format('xtensa-{0}-none-elf', matrix.chip || 'esp32') }}/release/micropython-esp32 \
            --min-stack-kb ${{ matrix.min_stack || 128 }} --max-frame-kb 32 --markdown | tee -a "$GITHUB_STEP_SUMMARY"

  # Random scripts through the whole interpreter (fuzz/fuzz_targets/eval.rs):
  # no panic, hang or native stack overflow in 5 minutes
  fuzz:
    name: Fuzz the interpreter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz for 5 minutes
        run: |
          mkdir -p fuzz/corpus/eval
          cp tests/cpython/*.py micropython-esp32/scripts/*.py hello.py fuzz/corpus/eval/
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu eval fuzz/corpus/eval -- \
            -dict=fuzz/fuzz.dict -max_total_time=300 -max_len=4096 -timeout=10 -rss_limit_mb=2048

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
