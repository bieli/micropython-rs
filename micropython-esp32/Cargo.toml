[package]
edition      = "2021"
name         = "micropython-esp32"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "micropython-esp32"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "=1.0.0", features = ["unstable"] }
micropython-rs = { path = "..", default-features = false, features = ["iram"] }

esp-bootloader-esp-idf = { version = "=0.4.0" }
critical-section = "1.2.0"
esp-backtrace = { version = "=0.18.1", features = [
  "panic-handler",
  "println",
] }
esp-println = { version = "=0.16.1" }
# `nb::block!` for the blocking ADC read
nb = "1.1"
# sqrt and sin for the native float tests of machine.bench() (the interpreter's
# floats use it too)
libm = "0.2"
# Atomic read-modify-write (fetch_or, swap) also on the ESP32-C3, whose RISC-V
# core has no atomic instructions (esp-hal sets portable-atomic up for it)
portable-atomic = { version = "1.11", default-features = false }
# Flash access for main.py saved in the nvs partition
esp-storage = { version = "=0.8.1" }
embedded-storage = "0.3"
# Static buffers for the REPL source arena and the interpreter heap

# Wi-Fi (only with `--features wifi`): the radio driver, the scheduler it runs
# its tasks on, a heap for it, and smoltcp for DHCP and IP
esp-radio = { version = "=0.17.0", features = ["wifi", "smoltcp", "esp-alloc", "unstable"], optional = true }
esp-rtos = { version = "=0.2.0", features = ["esp-radio", "esp-alloc"], optional = true }
esp-alloc = { version = "=0.9.0", optional = true }
smoltcp = { version = "0.12", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-dhcpv4", "socket-dns", "socket-udp", "socket-tcp"], optional = true }

# TFT ST7789 display & 2D text rendering (only pulled in with `--features tft`)
mipidsi = { version = "0.9.0", optional = true }
embedded-graphics = { version = "0.8.1", optional = true }
embedded-hal-bus = { version = "0.3.0", optional = true }

[features]
# Default build: any ESP32 board, Python print() goes to the USB/UART serial monitor,
# led_on()/led_off() drive the onboard LED (GPIO2 on most DevKit boards).
default = ["full", "esp32"]
# The chip (`make flash CHIP=esp32s3`): exactly one. The build target must match
# (xtensa-esp32-none-elf / xtensa-esp32s3-none-elf; the Makefile picks it).
esp32 = [
  "esp-hal/esp32", "esp-bootloader-esp-idf/esp32", "esp-backtrace/esp32", "esp-println/esp32",
  "esp-storage/esp32", "esp-radio?/esp32", "esp-rtos?/esp32", "esp-alloc?/esp32",
]
# ESP32-C3 (RISC-V; target riscv32imc-unknown-none-elf), console on the chip's
# own USB port, such as the ESP32-C3 Super Mini (LED on GPIO8, BOOT on GPIO9)
esp32c3 = [
  "esp-hal/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-backtrace/esp32c3", "esp-println/esp32c3",
  "esp-storage/esp32c3", "esp-radio?/esp32c3", "esp-rtos?/esp32c3", "esp-alloc?/esp32c3",
]
# ESP32-S3 boards with the console on the chip's own USB port (USB-Serial/JTAG),
# such as the Seeed XIAO ESP32-S3 (user LED on GPIO21)
esp32s3 = [
  "esp-hal/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3",
  "esp-storage/esp32s3", "esp-radio?/esp32s3", "esp-rtos?/esp32s3", "esp-alloc?/esp32s3",
]
# The interpreter's feature level (`make flash LEVEL=...`, see the README):
# minimal: no classes, formatting, files or .py modules; smallest RAM use
# medium: + classes and string formatting
# full: + open()/os, .py and frozen modules, sys: Thonny, mpremote, `machine`
minimal = ["micropython-rs/minimal"]
medium = ["micropython-rs/medium"]
full = ["micropython-rs/full", "machine"]
# MicroPython's `machine` module (Pin, ADC, PWM, I2C, UART, SPI, WDT): Python
# code built into the firmware (modules/machine.py, about 9 KB of flash); it
# needs the full level (classes and frozen modules)
machine = ["micropython-rs/full"]
# Wi-Fi and MicroPython's `network` module (network.WLAN)
wifi = ["dep:esp-radio", "dep:esp-rtos", "dep:esp-alloc", "dep:smoltcp"]
# Single precision floats (`make flash FLOAT=32`): the ESP32's FPU computes
# them in hardware; double precision (the default) runs in software
float32 = ["micropython-rs/float32"]
# LilyGO TTGO T-Display (ST7789 1.14" TFT): print() is drawn on the screen and mirrored to serial.
tft = ["dep:mipidsi", "dep:embedded-graphics", "dep:embedded-hal-bus"]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
